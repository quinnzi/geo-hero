<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSpin</title>
    <link rel="stylesheet" href="globe.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Iceberg&family=Jockey+One&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap" rel="stylesheet">

<script src="//cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
</head>
<body style="display: flex; flex-direction: column; width: 100%;">
        <header style="display: flex; flex-direction: column; margin: 0;">
    <section class="header">
        <div id="title-con">
        <h1 id="tit1">Geospin</h1>
        <h1 id="tit2">(A small educator for the geographically illiterate)</h1>
        
       </div>
    </section>

   
</header>


<section id="historyCon" style="padding-top: 3rem;">
   
</section>



</body>

<script> 

const raw = localStorage.getItem("Countries")
const log = JSON.parse(raw)
console.log(log)
 const no = document.createElement('p')

localStorage.getItem("Countries")
if(!log || log === null){
   
    no.textContent = "No countries logged yet"
    document.getElementById("historyCon").appendChild(no)
}
else{
log.forEach(element => {
    const logged = document.createElement("div")
    logged.innerHTML =
        `<div class='counP'>
       <img src=${element.image} style="width: 12rem; border-top-left-radius: 20px; border-bottom-left-radius: 20px;">
      <div style="display: flex; justify-content: space-between; width: 100%;">
       <div style="display:flex; flex-direction: column;">
       <h2 style="margin: 1.2rem;">${element.name}</h2> 
       <p style="margin: 1.3rem; font-size: 1.2vw;">Avg Quiz Score: none-yet</p>
       </div>
       <p style="margin: 3rem; font-size: 2vw;">x${element.times}</p>
   </div>`;
    
   document.getElementById("historyCon").appendChild(logged)

    
})
}
</script>

</html>
